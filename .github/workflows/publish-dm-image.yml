# Builds the emulator with Digital Mirror's patches for amd64 and arm64 and publishes one image
# under both. Triggered by a tag of the form v<upstream version>-dm.<n>; the image tag drops the v.
name: publish-dm-image

on:
  push:
    tags: ["v*-dm.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A clean Bazel build of the emulator and its GoogleSQL dependency is hours of compiling.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the ${{ matrix.arch }} image
        run: |
          tag="${GITHUB_REF_NAME#v}"
          docker build . -f build/docker/Dockerfile.ubuntu -t "$IMAGE:$tag-${{ matrix.arch }}"
          docker push "$IMAGE:$tag-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish one tag for both architectures
        run: |
          tag="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
